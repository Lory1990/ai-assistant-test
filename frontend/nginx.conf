server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualsiasi route lato client (es. /investments, /profile) deve
    # servire index.html — altrimenti un refresh o un link diretto da' 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy del WebSocket verso il backend, con gli header di upgrade
    # necessari. Nota: oggi il frontend si collega direttamente a
    # ws://<backend>:3000/ws (stesso host usato per le chiamate REST, vedi
    # VITE_API_URL), quindi questo blocco non e' sul percorso attivo finche'
    # VITE_API_URL non viene fatto puntare a questo host nginx (es.
    # http://localhost:8080): e' pronto per quando si vorra' consolidare
    # frontend+API dietro un'unica origin.
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
